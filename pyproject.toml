[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlocal"
version = "0.1.0"
description = "Private, fully-local voice dictation: hold a hotkey, speak, text appears in the active window. No cloud, ever."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
flowlocal = "flowlocal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
